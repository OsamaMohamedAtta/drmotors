<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DR.MOTORS — Vehicle File</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #eee9df;
            color: #25231f;
            font-family: Arial, sans-serif
        }

        a {
            color: inherit
        }

        .brand {
            font: 700 27px Georgia, serif;
            letter-spacing: -.05em
        }

        header {
            padding: 24px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #d2c9ba
        }

        .meta {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .18em;
            color: #776f63
        }

        .hero {
            max-width: 1250px;
            margin: auto;
            padding: 85px 7vw;
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            gap: 70px;
            align-items: center
        }

        .k {
            font-size: 11px;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: #9a7540;
            font-weight: bold
        }

        h1 {
            letter-spacing: -.07em;
            margin: 18px 0 28px
        }

        .copy {
            font: 18px/1.8 Georgia, serif;
            color: #6e675d;
            max-width: 560px
        }

        .form {
            background: #24231f;
            color: white;
            padding: 38px;
            box-shadow: 24px 24px 0 #d5ccbd
        }

        .form input {
            width: 100%;
            background: none;
            border: 0;
            border-bottom: 1px solid #6d685e;
            outline: 0;
            color: white;
            padding: 18px 0;
            font: 18px monospace;
            text-transform: uppercase;
            margin: 10px 0 22px
        }

        .form button {
            width: 100%;
            padding: 17px;
            border: 0;
            background: #aa8046;
            color: white;
            font-weight: bold;
            cursor: pointer
        }

        .status {
            font-size: 12px;
            color: #e2b9a4;
            margin-top: 13px
        }

        .rule {
            border-top: 1px solid #d2c9ba;
            border-bottom: 1px solid #d2c9ba;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            text-transform: uppercase;
            letter-spacing: .16em;
            font-size: 10px;
            color: #776f63
        }

        .features {
            max-width: 1250px;
            margin: auto;
            padding: 70px 7vw 100px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 55px
        }

        .feature {
            border-top: 2px solid #25231f;
            padding-top: 15px
        }

        .feature h3 {
            font: 400 28px Georgia, serif;
            margin: 35px 0 10px
        }

        .feature p {
            color: #776f63;
            line-height: 1.7
        }

        footer {
            border-top: 1px solid #d2c9ba;
            padding: 25px 7%;
            display: flex;
            justify-content: space-between;
            color: #776f63;
            font-size: 12px
        }

        @media(max-width:800px) {
            .hero {
                grid-template-columns: 1fr;
                padding-top: 55px
            }

            .features {
                grid-template-columns: 1fr;
                gap: 35px
            }

            .rule {
                display: none
            }

            footer {
                flex-direction: column;
                gap: 10px
            }
        }

        .wrap {
            max-width: 1200px;
            margin: auto;
            padding: 65px 7vw
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 330px;
            gap: 55px;
            margin-top: 45px
        }

        /* .photos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px
        } */

        .photos img {
            width: 100%;
        }

        .empty {
            padding: 55px;
            text-align: center;
            border: 1px solid #d2c9ba;
            color: #776f63
        }

        .rows {
            border-top: 2px solid #25231f
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 18px 0;
            border-bottom: 1px solid #d2c9ba
        }

        .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .14em;
            color: #81796e
        }

        .value {
            font-weight: bold;
            text-align: right
        }

        .buy {
            background: #25231f;
            color: white;
            padding: 27px;
            margin-top: 30px
        }

        .amount {
            font: 400 43px Georgia, serif;
            margin: 8px 0 18px
        }

        .buy button {
            width: 100%;
            padding: 15px;
            background: #aa8046;
            color: white;
            border: 0;
            font-weight: bold;
            cursor: pointer
        }

        .contact {
            font-size: 16.5px;
            color: #81796e;
            line-height: 1.7;
            margin-top: 20px
        }

        .vin {
            font: 12px monospace;
            color: #81796e;
            word-break: break-all
        }

        @media(max-width:800px) {
            .layout {
                grid-template-columns: 1fr
            }

            .photos {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="brand">DR.MOTORS</div><a class="meta" href="index.html">New search</a>
    </header>
    <main class="wrap">
        <div id="app">Loading…</div>
    </main>
    <script>
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/1_qEWJ3grdeAajNCaCUiDg7GYgW8efa_vRcc4u12Xsn4/gviz/tq?tqx=out:csv&gid=0";
        const norm = v => String(v ?? "").trim().toUpperCase().replace(/\s+/g, "");
        function csv(t) { let R = [], r = [], c = "", q = 0; for (let i = 0; i < t.length; i++) { let x = t[i], n = t[i + 1]; if (q) { if (x == '"' && n == '"') { c += '"'; i++ } else if (x == '"') q = 0; else c += x } else if (x == '"') q = 1; else if (x == ',') { r.push(c); c = "" } else if (x == '\n') { r.push(c.replace(/\r$/, "")); R.push(r); r = []; c = "" } else c += x } if (c || r.length) { r.push(c); R.push(r) } return R }
        async function data() { let r = await fetch(SHEET_URL); let a = csv(await r.text()), h = a[0] || []; return a.slice(1).map(x => Object.fromEntries(h.map((k, i) => [k.trim(), (x[i] || "").trim()]))).filter(x => x.VIN) }
        const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m]));
        const pics = v => ["Photo1", "Photo2", "Photo3", "Photo4"].map(k => v[k]).filter(Boolean).filter((x, i, a) => a.indexOf(x) == i);
        async function render() { let a = document.getElementById("app"), id = norm(new URLSearchParams(location.search).get("id")); try { let vs = await data(), v = vs.find(x => norm(x.VIN) == id); if (!v) { a.innerHTML = '<div class="empty">Vehicle file not found.</div>'; return } let p = pics(v); document.title = "DR.MOTORS — " + (v["Motors Name"] || "Vehicle"); a.innerHTML = `<div class="k">Vehicle file</div><h1>${esc(v["Motors Name"] || "Vehicle")}</h1><div class="vin">VIN · ${esc(v.VIN)}</div><div class="layout"><section><div class="photos">${p.length ? p.map(x => `<img src="${esc(x)}" loading="lazy" onerror="this.remove()">`).join("") : '<div class="empty">Photography unavailable.</div>'}</div></section><aside><div class="rows">${[["Model / Year", v.Model], ["Color", v.Colors], ["Mileage", v.KM], ["Engine", v.Engine], ["Lot Number", v.LotNumber]].map(x => `<div class="row"><div class="label">${x[0]}</div><div class="value">${esc(x[1] || "—")}</div></div>`).join("")}</div><div class="buy"><div class="label" style="color:#bdb5aa">Full report</div><div class="amount">$200</div><div style="color:#c7c0b6;font-size:13px;margin-bottom:18px">Request the complete vehicle report.</div><button onclick="location.href='mailto:drmotorscars@gmail.com'">REQUEST REPORT</button></div><div class="contact">Questions? <a href="mailto:drmotorscars@gmail.com">Contact by email</a></div></aside></div>` } catch (e) { a.innerHTML = '<div class="empty">Unable to load this vehicle file.</div>' } } render()</script>
</body>

</html>
